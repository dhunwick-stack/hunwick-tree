<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunwick Family Tree — Login</title>
  <!-- Netlify Identity widget handles session cookies natively -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f5efe2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Crimson Pro', serif;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(139,107,74,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(122,59,30,0.06) 0%, transparent 50%);
    }
    .box {
      background: #fdf8f0;
      border: 1px solid rgba(139,107,74,0.2);
      border-radius: 18px;
      padding: 44px 48px;
      width: min(440px, 94vw);
      box-shadow: 0 12px 56px rgba(90,60,20,0.18);
      text-align: center;
    }
    .crest { font-size: 3rem; margin-bottom: 16px; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: #1a1208;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .subtitle { font-size: 0.9rem; color: #8b6f4a; font-style: italic; margin-bottom: 32px; }
    .mode-title { font-size: 1rem; color: #5c4730; font-weight: 600; margin-bottom: 20px; }
    input[type=email], input[type=password] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid rgba(139,107,74,0.35);
      border-radius: 9px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
      color: #1a1208;
      margin-bottom: 12px;
      transition: border-color 0.15s;
      display: block;
    }
    input:focus { outline: none; border-color: #7a3b1e; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #5c4730;
      color: #fdf8f0;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-family: 'Crimson Pro', serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
      display: block;
    }
    .btn:hover { background: #7a3b1e; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .link-btn {
      background: none; border: none;
      color: #c4a47a; font-family: inherit; font-size: 0.85rem;
      cursor: pointer; text-decoration: underline;
      margin-top: 12px; display: block; width: 100%; text-align: center;
    }
    .link-btn:hover { color: #8b6f4a; }
    .msg { margin-top: 14px; font-size: 0.88rem; min-height: 20px; }
    .msg.err { color: #a00; }
    .msg.ok  { color: #2a6b2a; }
    #mode-forgot, #mode-setpw { display: none; }
  </style>
</head>
<body>
<div class="box">
  <div class="crest">🌲</div>
  <h1>HUNWICK</h1>
  <div class="subtitle">Family Tree</div>

  <!-- LOGIN -->
  <div id="mode-login">
    <div class="mode-title">Family members only</div>
    <input id="login-email" type="email" placeholder="Email address" autocomplete="email">
    <input id="login-pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="login-btn" onclick="doLogin()">Log in</button>
    <button class="link-btn" onclick="showForgot()">Forgot password?</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <!-- FORGOT -->
  <div id="mode-forgot">
    <div class="mode-title">Reset password</div>
    <input id="forgot-email" type="email" placeholder="Your email address" autocomplete="email">
    <button class="btn" id="forgot-btn" onclick="doForgot()">Send reset link</button>
    <button class="link-btn" onclick="showLogin()">← Back to login</button>
    <div class="msg" id="forgot-msg"></div>
  </div>

  <!-- SET PASSWORD (invite / recovery token) -->
  <div id="mode-setpw">
    <div class="mode-title" id="setpw-title">Welcome — set your password</div>
    <input id="setpw-pw"  type="password" placeholder="Choose a password" autocomplete="new-password">
    <input id="setpw-pw2" type="password" placeholder="Confirm password"  autocomplete="new-password">
    <button class="btn" id="setpw-btn" onclick="doSetPassword()">Set password &amp; log in</button>
    <div class="msg" id="setpw-msg"></div>
  </div>
</div>

<script>
const IDENTITY = 'https://hunwick-tree.netlify.app/.netlify/identity';
const redirectTo = new URLSearchParams(window.location.search).get('redirect') || '/';

// ── Token detection ─────────────────────────────
const _hash   = new URLSearchParams(window.location.hash.replace('#', ''));
const inviteToken   = _hash.get('invite_token');
const recoveryToken = _hash.get('recovery_token');
const specialToken  = inviteToken || recoveryToken;

if (specialToken) {
  history.replaceState(null, '', window.location.pathname + window.location.search);
  document.getElementById('mode-login').style.display  = 'none';
  document.getElementById('mode-setpw').style.display  = 'block';
  if (recoveryToken) document.getElementById('setpw-title').textContent = 'Reset your password';
}

// ── If already logged in via widget session, redirect ──
netlifyIdentity.on('init', user => {
  if (user) {
    // Already have a valid session — set our cookie and redirect
    const token = user.token?.access_token;
    if (token) setCookie(token, user.token.expires_in || 3600);
    window.location.href = redirectTo;
  }
});
netlifyIdentity.init({ APIUrl: IDENTITY });

// ── Cookie helpers ──────────────────────────────
function setCookie(token, maxAge) {
  document.cookie = `nf_jwt=${token}; path=/; max-age=${maxAge}; SameSite=Lax`;
}

function onLoginSuccess(data) {
  const token    = data.access_token;
  const maxAge   = data.expires_in || 3600;
  setCookie(token, maxAge);
  const msg = document.querySelector('.msg:not([style*="none"])') || document.getElementById('login-msg');
  msg.className = 'ok'; msg.textContent = 'Logged in! Redirecting...';
  setTimeout(() => window.location.href = redirectTo, 400);
}

// ── Login ───────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  const msg   = document.getElementById('login-msg');
  const btn   = document.getElementById('login-btn');
  if (!email || !pw) { msg.className='err'; msg.textContent='Please enter email and password.'; return; }
  btn.disabled = true; msg.className=''; msg.textContent='Logging in...';
  try {
    const res  = await fetch(`${IDENTITY}/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'password', username: email, password: pw })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed');
    onLoginSuccess(data);
  } catch(e) {
    msg.className='err'; msg.textContent = e.message;
    btn.disabled = false;
  }
}

// ── Forgot password ─────────────────────────────
async function doForgot() {
  const email = document.getElementById('forgot-email').value.trim();
  const msg   = document.getElementById('forgot-msg');
  const btn   = document.getElementById('forgot-btn');
  if (!email) { msg.className='err'; msg.textContent='Please enter your email.'; return; }
  btn.disabled = true; msg.className=''; msg.textContent='Sending...';
  try {
    const res = await fetch(`${IDENTITY}/recover`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    if (!res.ok) { const d = await res.json(); throw new Error(d.msg || 'Failed'); }
    msg.className='ok'; msg.textContent='Reset link sent — check your email.';
  } catch(e) {
    msg.className='err'; msg.textContent = e.message;
    btn.disabled = false;
  }
}

// ── Set password ────────────────────────────────
async function doSetPassword() {
  const pw  = document.getElementById('setpw-pw').value;
  const pw2 = document.getElementById('setpw-pw2').value;
  const msg = document.getElementById('setpw-msg');
  const btn = document.getElementById('setpw-btn');
  if (pw.length < 8) { msg.className='err'; msg.textContent='Minimum 8 characters.'; return; }
  if (pw !== pw2)    { msg.className='err'; msg.textContent='Passwords do not match.'; return; }
  btn.disabled = true; msg.className=''; msg.textContent='Setting password...';
  try {
    const type = inviteToken ? 'signup' : 'recovery';
    const res  = await fetch(`${IDENTITY}/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, token: specialToken, password: pw })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.error_description || 'Failed');
    onLoginSuccess(data);
  } catch(e) {
    msg.className='err'; msg.textContent = e.message;
    btn.disabled = false;
  }
}

// ── UI helpers ──────────────────────────────────
function showForgot() {
  document.getElementById('mode-login').style.display  = 'none';
  document.getElementById('mode-forgot').style.display = 'block';
  document.getElementById('forgot-email').value = document.getElementById('login-email').value;
}
function showLogin() {
  document.getElementById('mode-forgot').style.display = 'none';
  document.getElementById('mode-login').style.display  = 'block';
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('mode-setpw').style.display !== 'none') doSetPassword();
  else if (document.getElementById('mode-forgot').style.display !== 'none') doForgot();
  else doLogin();
});
</script>
</body>
</html>
